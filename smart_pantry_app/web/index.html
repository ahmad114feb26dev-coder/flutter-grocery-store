<body>
  <script>
    window.playPantryAlarm = function() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        
        // Sequence of chime tones (urgent pleasant alarm)
        const notes = [
          { f: 880, d: 0.15, pause: 0.05 },
          { f: 1108.73, d: 0.15, pause: 0.05 },
          { f: 1318.51, d: 0.35, pause: 0.15 },
          { f: 880, d: 0.15, pause: 0.05 },
          { f: 1108.73, d: 0.15, pause: 0.05 },
          { f: 1318.51, d: 0.50, pause: 0.20 }
        ];

        let time = ctx.currentTime + 0.05;
        notes.forEach(n => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, time);
          
          gain.gain.setValueAtTime(0.25, time);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + n.d);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(time);
          osc.stop(time + n.d);
          time += n.d + n.pause;
        });
      } catch (e) {
        console.warn('Could not play pantry alarm audio:', e);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
